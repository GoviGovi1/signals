name: signals
# Free signal engine + Telegram broadcast. The schedule is every 15 min; an external cron may dispatch
# this workflow about every 5 min. Signals only: public market data, no keys, no wallet, no orders.
# Commands are answered by the Cloudflare Worker webhook (worker/) when SIGNALS_WEBHOOK_URL is set.
# Until then, bot.py --serve keeps polling getUpdates. It never polls while a webhook is active.
# run.py also refreshes the catalyst cache (catalyst/*.json: unlocks, TVL/fees, sectors, listings, on-chain) when due.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # off-peak minutes; GitHub may still delay runs
  workflow_dispatch:
    inputs:
      keepalive:
        description: "Make an empty keepalive commit"
        type: boolean
        default: false
      force_catalyst:
        description: "Refresh every catalyst source now (unlocks, TVL/fees, listings, sectors, on-chain)"
        type: boolean
        default: false
      webhook_off:
        description: "Remove the Telegram webhook and send broadcasts only. Also delete SIGNALS_WEBHOOK_URL and SIGNALS_WEBHOOK_SECRET or the next run turns the webhook back on."
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/signals.yml"]

concurrency:
  group: signals
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      site: ${{ steps.commit.outputs.site }}
      sha: ${{ steps.commit.outputs.sha }}
    env:
      SIGNALS_TG_TOKEN: ${{ secrets.SIGNALS_TG_TOKEN }}
      SIGNALS_STATE_KEY: ${{ secrets.SIGNALS_STATE_KEY }}
      SIGNALS_WEBHOOK_URL: ${{ secrets.SIGNALS_WEBHOOK_URL }}
      SIGNALS_WEBHOOK_SECRET: ${{ secrets.SIGNALS_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install chart library
        run: python3 -m pip install -q --user --break-system-packages numpy matplotlib || python3 -m pip install -q --user numpy matplotlib
      - name: Restore private state
        id: unpack
        run: python3 state.py unpack
      - name: Force catalyst refresh
        if: inputs.force_catalyst == true
        run: python3 catalyst.py --force
      - name: Signals
        run: python3 run.py
      - name: Telegram broadcast (commands stay on the webhook)
        run: |
          if [ "${{ inputs.webhook_off }}" = "true" ]; then
            python3 bot.py --webhook-off
            python3 bot.py --push
          else
            python3 bot.py --serve
          fi
      - name: Build site data
        if: always()
        run: python3 publish.py --no-push
      - name: Save state and commit
        id: commit
        if: always() && steps.unpack.outcome == 'success'
        run: |
          python3 state.py pack
          git config user.name "signals-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals.json signals.csv site/data.json state/ catalyst/
          if [ -f site/bot/replies.json ]; then git add site/bot/replies.json; fi
          git add -A site/charts 2>/dev/null || true
          site=false
          git diff --cached --quiet -- site/ || site=true
          if [ "${{ github.event_name }}" != "schedule" ]; then site=true; fi
          if ! git diff --cached --quiet; then
            git commit -q -m "data $(date -u +%FT%TZ) [skip ci]"
          elif [ "${{ inputs.keepalive }}" = "true" ] || [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 20 * 86400 )) ]; then
            git commit -q --allow-empty -m "keepalive $(date -u +%F) [skip ci]"
          fi
          for i in 1 2 3; do
            git push -q origin HEAD:main && break
            git pull -q --rebase origin main
          done
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Keep the schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H%M)" \< "0016" ] || [ "${{ github.event_name }}" != "schedule" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/signals.yml/enable" >/dev/null && echo "schedule enabled"
          fi

  deploy:
    needs: run
    if: always() && needs.run.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.run.outputs.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
