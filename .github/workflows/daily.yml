name: daily-coin-gate
# Once a day: re-run the live chart rules on the last 45 days for every universe coin and write
# catalyst/coin_gate.json (chart signals only on coins with a positive result after fees).
# Public OKX data only: no secrets, no keys, no orders.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
concurrency:
  group: daily-gate
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch 45 days of history
        run: python3 bt_fetch.py --days 45 --no-funding
      - name: Coin gate
        run: python3 backtest_catalyst.py --gate
      - name: Commit
        run: |
          git config user.name "signals-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalyst/coin_gate.json
          git diff --cached --quiet && exit 0
          git commit -q -m "coin gate $(date -u +%F) [skip ci]"
          for i in 1 2 3 4; do
            git push -q origin HEAD:main && break
            git pull -q --rebase origin main
          done
