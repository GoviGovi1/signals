name: daily-coin-gate
# Once a day: refresh the OKX universe, re-run the live chart rules on the last 45 days for every universe coin and write
# catalyst/coin_gate.json (chart signals only on coins with a positive result after fees).
# Public OKX data only: no secrets, no keys, no orders.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
concurrency:
  group: daily-gate
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install numpy
        run: python3 -m pip install -q --user --break-system-packages numpy || python3 -m pip install -q --user numpy
      - name: Refresh the coin universe (up to 350 OKX coins)
        run: python3 -c "import universe; universe.refresh(force=True)"
      - name: Fetch 55 days of history (45 tested + indicator warm-up)
        env:
          BT_THREADS: "6"
        run: python3 bt_fetch.py --days 55 --no-funding
      - name: Coin gate (strategy v4 chart-reading rules)
        run: python3 backtest_v4.py --gate
      - name: Commit
        run: |
          git config user.name "signals-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalyst/coin_gate.json catalyst/universe.json
          git diff --cached --quiet && exit 0
          git commit -q -m "coin gate $(date -u +%F) [skip ci]"
          for i in 1 2 3 4; do
            git push -q origin HEAD:main && break
            git pull -q --rebase origin main
          done
